<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição | Página de Eventos</title>
    <link rel="stylesheet" href="./assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="header-menu">
        <img class="logo" alt="logotipo eventos fatec" title="Logotipo eventos fatec"
            src="./assets/images/logotipo-eventos-fatec.png" />
        <ul class="navigation">
            <li class="item">
                <a class="link" href="index.html">Eventos</a>
            </li>
            <li class="item">
                <a class="link" href="index.html#categorias">Categorias</a>
            </li>
            <li class="item">
                <button class="call-to-action">Explorar <i>Eventos</i></button>
            </li>
        </ul>
    </nav>

    <main class="subscription">
        <div id="inscricao-vazio" class="empty-state" hidden>
            <p>Nenhum evento selecionado.</p>
            <a class="btn-cta" href="index.html">Ver eventos</a>
        </div>

        <div id="inscricao-conteudo" class="subscription-content" hidden>
            <section class="subscription-summary" id="resumo-evento"></section>

            <form class="subscription-form" id="form-inscricao" novalidate>
                <div class="form-field">
                    <label for="campo-nome">Nome completo</label>
                    <input type="text" id="campo-nome" name="nome" placeholder="Digite seu nome" />
                    <span class="form-error" id="erro-nome" hidden></span>
                </div>

                <div class="form-field">
                    <label for="campo-email">E-mail</label>
                    <input type="email" id="campo-email" name="email" placeholder="Digite seu e-mail" />
                    <span class="form-error" id="erro-email" hidden></span>
                </div>

                <button type="submit" class="call-to-action">Confirmar inscrição</button>
            </form>
        </div>

        <div id="inscricao-confirmada" class="subscription-confirmation" hidden>
            <h1 class="title">Inscrição confirmada!</h1>
            <p>Guarde seu código de confirmação: <strong id="codigo-confirmacao"></strong></p>
            <a class="btn-cta" id="link-voltar-evento" href="index.html">Voltar para o evento</a>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Eventos Fatec — Projeto de Desenvolvimento Web, 2º ciclo.</p>
    </footer>

    <script src="./js/api.js"></script>
    <script src="./js/inscricao.js"></script>
</body>

</html>
