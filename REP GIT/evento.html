<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Detalhes do Evento | Página de Eventos</title>
    <link rel="stylesheet" href="./assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
